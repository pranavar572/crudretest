<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Inventory CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-3 p-2">

        <h1 class="text-center text-primary mb-4">
            Product Inventory CRUD
        </h1>

        <form id="productsForm">

            <input id="editStatus" type="hidden" value="">

            <div class="row g-3 mb-4">

                <div class="col-lg-3">
                    <input id="productid" type="text" class="form-control" placeholder="Product ID" required>
                </div>

                <div class="col-lg-3">
                    <input id="productName" type="text" class="form-control" placeholder="Product Name" required>
                </div>

                <div class="col-lg-3">
                    <input id="price" type="number" class="form-control" placeholder="Price" min="0" required>
                </div>

                <div class="col-lg-3">
                    <input id="quantity" type="number" class="form-control" placeholder="Quantity" min="0" required>
                </div>

                <div class="col-lg-3">
                    <button type="submit" class="btn btn-success w-100">
                        Add Product
                    </button>
                </div>

            </div>

        </form>

        <div class="alert alert-primary">
            Total Products: <span id="totalProducts">0</span>
        </div>

        <div class="alert alert-warning">
            Low Stock Products: <span id="lowStock">0</span>
        </div>


        <table class="table table-bordered table-hover">

            <thead class="table-dark text-center">
                <tr>
                    <th>#</th>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Stock Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <script src="./main.js"></script>

</body>

</html>
